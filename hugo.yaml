baseURL: https://hug0-w.github.io/
languageCode: en-gb
title: Hugo Wharton

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

# No tag pages: the site is just an intro, posts and publications.
disableKinds: [taxonomy, term]

pagination:
  pagerSize: 20

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

params:
  author: Hugo Wharton
  description: "PhD student at the MRC Biostatistics Unit, University of Cambridge."
  # Plain text links shown on the home page.
  links:
    - name: GitHub
      url: "https://github.com/hug0-w"
    - name: Google Scholar
      url: "https://scholar.google.com/citations?user=YOUR_ID"
    - name: LinkedIn
      url: "https://www.linkedin.com/in/hugo-wharton-a2004abc/"
  # Set to true to load KaTeX on every page; or set `math: true` per post.
  math: false

menu:
  main:
    - name: Posts
      pageRef: /posts
      weight: 10
    - name: Publications
      pageRef: /publications
      weight: 20

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["$$", "$$"], ["\\[", "\\]"]]
          inline: [["$", "$"], ["\\(", "\\)"]]
    renderer:
      unsafe: true
  highlight:
    # Plain monospace code, no syntax colours.
    noClasses: false
    codeFences: true
