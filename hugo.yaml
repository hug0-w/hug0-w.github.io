baseURL: https://hug0-w.github.io/
locale: en-gb
title: My Blog
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # Fuse.js search index

taxonomies:
  tag: tags

params:
  env: production
  title: My Blog
  description: "Notes on machine learning."
  author: Hugo Wharton
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  disableSpecial1stPost: true

  homeInfoParams:
    Title: "Hi there 👋"
    Content: >
      Welcome to my blog. I am a PhD student at the MRC Biostatistics Unit based at the University of Cambridge.

  socialIcons:
    - name: github
      url: "https://github.com/username"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=YOUR_ID"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 10
    - identifier: search
      name: Search
      url: /search/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["$$", "$$"], ["\\[", "\\]"]]
          inline: [["$", "$"], ["\\(", "\\)"]]
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
