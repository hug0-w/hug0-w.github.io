<header class="site-header">
  <nav aria-label="Main">
    <ul role="list">
      <li><a href="{{ "/" | relLangURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a></li>
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ else if $.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
  {{- /* Theme switch. Shown only when JavaScript is available; otherwise the system preference applies. */}}
  <div id="theme-switch" class="theme-switch" role="group" aria-label="Colour theme" hidden>
    <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
    <button type="button" data-theme-choice="auto" aria-pressed="false">Auto</button>
  </div>
</header>
