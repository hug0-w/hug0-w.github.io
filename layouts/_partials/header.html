<header class="site-header">
  <nav aria-label="Main">
    <ul role="list">
      <li><a href="{{ "/" | relLangURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a></li>
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ else if $.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
  {{- /* Shown only when JavaScript is available; otherwise the system preference applies. */}}
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" hidden>Dark mode</button>
</header>
