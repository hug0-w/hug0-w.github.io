<footer class="site-footer">
  <p>&copy; {{ now.Year }} {{ site.Params.author | default site.Title }}
  {{- with site.Home.OutputFormats.Get "rss" }} &middot; <a href="{{ .RelPermalink }}">RSS feed</a>{{ end }}</p>
</footer>
<script>
(function () {
  var button = document.getElementById("theme-toggle");
  if (!button) return;
  var root = document.documentElement;
  var systemDark = window.matchMedia("(prefers-color-scheme: dark)");
  function current() {
    return root.getAttribute("data-theme") || (systemDark.matches ? "dark" : "light");
  }
  function update() {
    button.setAttribute("aria-pressed", current() === "dark" ? "true" : "false");
  }
  button.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    update();
  });
  if (systemDark.addEventListener) systemDark.addEventListener("change", update);
  button.hidden = false;
  update();
})();
</script>
