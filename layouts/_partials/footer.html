<footer class="site-footer">
  <p>&copy; {{ now.Year }} {{ site.Params.author | default site.Title }}
  {{- with site.Home.OutputFormats.Get "rss" }} &middot; <a href="{{ .RelPermalink }}">RSS feed</a>{{ end }}</p>
</footer>
<script>
(function () {
  var group = document.getElementById("theme-switch");
  if (!group) return;
  var root = document.documentElement;
  var buttons = group.querySelectorAll("button[data-theme-choice]");
  function saved() {
    try { var t = localStorage.getItem("theme"); return t === "light" || t === "dark" ? t : "auto"; }
    catch (e) { return "auto"; }
  }
  function apply(choice) {
    if (choice === "auto") {
      root.removeAttribute("data-theme");
      try { localStorage.removeItem("theme"); } catch (e) {}
    } else {
      root.setAttribute("data-theme", choice);
      try { localStorage.setItem("theme", choice); } catch (e) {}
    }
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      b.setAttribute("aria-pressed", b.getAttribute("data-theme-choice") === choice ? "true" : "false");
    }
  }
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener("click", function () { apply(this.getAttribute("data-theme-choice")); });
  }
  apply(saved());
  group.hidden = false;
})();
</script>
